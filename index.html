<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlphaSport Fitness Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="./logo.jpg" type="image/x-icon">
</head>
<body>
  <div class="login-container">
    <img src="./logo.jpg" alt="AlphaSport Fitness Logo" class="login-logo">
    <h1>AlphaSport Fitness</h1>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Login" required>
      <input type="password" id="password" placeholder="Parol" required>
      <button type="submit">Kirish</button>
    </form>
    <p id="loginError" class="error-msg"></p>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if(username === "raxmatillo" && password === "raxmatillo77") {
        window.location.href = "dashboard.html";
      } else {
        loginError.textContent = "Login yoki parol xato!";
      }
    });
  </script>
</body>
</html>
